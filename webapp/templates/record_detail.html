{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">{{ section|upper }}</p><h1>{{ title }}</h1></div><div class="actions">{% if edit_url %}<a class="button primary" href="{{ edit_url }}">Editar</a>{% endif %}<a class="button secondary" href="{{ back_url }}">Voltar</a></div></div>
<section class="panel form-panel">
  <dl>{% for label, value in values %}<dt>{{ label }}</dt><dd>{{ value }}</dd>{% endfor %}</dl>
</section>
{% endblock %}
