<dialog class="app-dialog export-dialog" id="eventExportDialog" aria-labelledby="eventExportTitle">
  <div class="dialog-heading">
    <div><p class="eyebrow">DOWNLOAD PRIVADO</p><h2 id="eventExportTitle">Exportar compromissos</h2></div>
    <button class="dialog-close" type="button" data-dialog-close aria-label="Fechar">×</button>
  </div>
  <form method="get" action="{{ url_for('web.export_events') }}" class="form-grid export-form">
    <label class="span-2">Período
      <select name="period" data-export-period>
        <option value="today">Hoje</option><option value="week">Esta semana</option>
        <option value="month" selected>Este mês</option><option value="custom">Intervalo personalizado</option>
      </select>
    </label>
    <label>Data inicial<input type="date" name="start_date" data-export-date disabled></label>
    <label>Data final<input type="date" name="end_date" data-export-date disabled></label>
    <label class="span-2">Formato
      <select name="format"><option value="pdf">PDF</option><option value="xlsx">Excel (.xlsx)</option><option value="ics">Calendário (.ics)</option></select>
    </label>
    <label>Categoria
      <select name="category"><option value="Todas">Todas</option>{% for category in categories %}<option value="{{ category }}">{{ category }}</option>{% endfor %}</select>
    </label>
    <label>Prioridade
      <select name="priority"><option value="Todas">Todas</option>{% for priority in priorities %}<option value="{{ priority }}">{{ priority }}</option>{% endfor %}</select>
    </label>
    <label class="span-2">Compromissos concluídos
      <select name="include_completed"><option value="0">Não incluir</option><option value="1">Incluir</option></select>
    </label>
    <div class="form-actions span-2"><button class="button secondary" type="button" data-dialog-close>Cancelar</button><button class="button primary" type="submit">Baixar</button></div>
  </form>
</dialog>
